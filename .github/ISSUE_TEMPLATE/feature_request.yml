name: Feature request
description: Propose an actionable improvement with concrete product or developer value
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement.

        For broad architecture or product direction changes, starting with a GitHub Discussion is preferred before implementation work begins.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user or developer pain point first.
      placeholder: The current workflow makes it hard to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What change do you want?
      description: Describe the behavior, UX, or API change you want to see.
      placeholder: I want the system to ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Why is this worth adding now?
      description: Explain expected impact, affected users, or why this fits the current project scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention current workarounds or other solutions you already considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Add links, mockups, examples, or related issues and discussions.
    validations:
      required: false